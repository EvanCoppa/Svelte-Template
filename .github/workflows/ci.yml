name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # $env/static/public needs values at build time; these placeholders are
  # never contacted. Real values live in Vercel, not in CI.
  PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

jobs:
  svelte-check:
    name: svelte-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Svelte + TS correctness
        run: npm run check

  oxlint:
    name: Oxlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Normal lint + anti-slop rules
        run: npm run lint:oxlint

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unused files, exports, dependencies
        run: npm run knip

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Behavior (vitest)
        run: npm test

  database:
    name: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Two PRs can each add a migration with the same timestamp and both
      # merge green; the CLI keys applied migrations by that stamp, so the
      # second file is silently skipped on push and refused on replay. Cheap
      # to catch here, and impossible to untangle later.
      - name: Every migration has its own timestamp
        run: |
          dupes=$(ls supabase/migrations | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate migration timestamps: $dupes"
            exit 1
          fi

      # Replays every migration from scratch against a disposable Postgres, so
      # a migration that only applies against today's production schema fails
      # here instead of on deploy. Free — this never touches a cloud project.
      - name: Apply migrations to a disposable database
        run: npx supabase db start

      - name: Schema lint
        run: npm run db:lint

      # database.types.ts is a pure function of supabase/migrations/, so a diff
      # here means a schema change landed without regenerating the types.
      #
      # --local is required, not decorative: the script picks its source from
      # PUBLIC_SUPABASE_URL, and the workflow-level placeholder above would
      # otherwise send it looking for a hosted project named "placeholder"
      # instead of the database this job just built from the migrations.
      - name: database.types.ts matches the migrations
        run: npm run db:types:check -- --local
