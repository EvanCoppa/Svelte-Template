name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # $env/static/public needs values at build time; these placeholders are
  # never contacted. Real values live in Vercel, not in CI.
  PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

jobs:
  svelte-check:
    name: svelte-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Svelte + TS correctness
        run: npm run check

  oxlint:
    name: Oxlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Normal lint + anti-slop rules
        run: npm run lint:oxlint

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unused files, exports, dependencies
        run: npm run knip

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Behavior (vitest)
        run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Runs the specs that never touch Supabase: the default-deny route
      # guard, the ?next= round trip and the security headers. They rely on
      # the workflow-level PUBLIC_SUPABASE_* placeholders above. The signed-in
      # specs skip themselves here because no stack is reachable — to run
      # those too, boot one first (`npx supabase start && npm run db:env`);
      # see README → "End-to-end tests".
      - name: Behavior through a real browser (playwright)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    name: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Replays every migration from scratch against a disposable Postgres, so
      # a migration that only applies against today's production schema fails
      # here instead of on deploy. Free — this never touches a cloud project.
      - name: Apply migrations to a disposable database
        run: npx supabase db start

      - name: Schema lint
        run: npm run db:lint

      # database.types.ts is a pure function of supabase/migrations/, so a diff
      # here means a schema change landed without regenerating the types.
      #
      # --local is required, not decorative: the script picks its source from
      # PUBLIC_SUPABASE_URL, and the workflow-level placeholder above would
      # otherwise send it looking for a hosted project named "placeholder"
      # instead of the database this job just built from the migrations.
      - name: database.types.ts matches the migrations
        run: npm run db:types:check -- --local
